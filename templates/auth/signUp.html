{% extends "auth/authBase.html" %} {% block conteudo %}

<div class="authContainer">
  <div>
    <h1 class="authTitle">Novo Registro</h1>
  </div>

  <form id="loginForm" method="post">

    <label for="name">Nome :</label>
    <input id="name" name="name" type="text" placeholder="Nome" required />

    <label for="email">Email :</label>
    <input id="email" name="email" type="email" placeholder="Email" required />

    <label for="password"> Senha :</label>
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Password"
      required
    />

    <label for="user_name"> User name :</label>
    <input
      id="user_name"
      name="user_name"
      type="text"
      placeholder="User Name"
      required
    />

    <button type="submit">Criar</button>
    <div class="reponse-redirect">
      <span id="error-msg"></span>

      <p class="redirect-auth">
        já tem uma conta ?
        <a href="/auth/login">Entrar</a>
      </p>
    </div>
  </form>
</div>

<script>

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
          e.preventDefault();
  
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          const name = document.getElementById('name').value
          const user_name = document.getElementById('user_name').value
  
          const response = await fetch('/auth/create_account', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json'
              },
              body: JSON.stringify({ email: email, password: password, name: name, user_name: user_name })
          });
  
          if (response.ok) {
              const data = await response.json();
              window.location.href =  data.redirect_url; 
          } else {
              const errorData = await response.json();
              alert('Erro: ' + errorData.detail);
              const errorElement = document.getElementById('error-msg');
              if(errorElement){
                errorElement.innerText = errorData.detail;
                errorElement.style.display = 'block';
              }
          }
      });
  
  
  </script>

{% endblock%}
